[project]
name = "mobisentra"
version = "0.1.0"
description = "MobiSentra AI edge pipeline — CCTV → detections → safety events (AGPL-3.0)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mobisentra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
