# MobiSentra camera registry — active configuration.
#
# Default = bundled sample videos (runs-without-hardware). Real CCTV is a
# config change only: swap `sample://` for `rtsp://...`.
#
# Polygon coordinates are normalized to [0.0, 1.0] relative to the frame.
# Each zone carries an explicit `type` — occupancy (needs max_capacity),
# restricted, or door. Thresholds override defaults (see ingestion/config.py).

cameras:
  - id: BUS_102_CAM_04
    vehicle_id: BUS_102
    source: sample://videos/bus_interior_01.mp4
    analyze_every_n_frames: 1
    zones:
      bus_area:
        type: occupancy
        polygon: [[0.05, 0.05], [0.95, 0.05], [0.95, 0.95], [0.05, 0.95]]
        max_capacity: 50
      door_roi:
        type: door
        polygon: [[0.80, 0.40], [0.95, 0.40], [0.95, 0.85], [0.80, 0.85]]
    thresholds:
      occupancy_confirm_frames: 30
      restricted_loiter_seconds: 5
      door_obstruct_seconds: 3

  - id: METRO_C03_CAM_07
    vehicle_id: METRO_C03
    source: sample://videos/metro_coach_01.mp4
    zones:
      coach_area:
        type: occupancy
        polygon: [[0.02, 0.10], [0.98, 0.10], [0.98, 0.92], [0.02, 0.92]]
        max_capacity: 80
      restricted_zone:
        type: restricted
        polygon: [[0.60, 0.75], [0.98, 0.75], [0.98, 0.98], [0.60, 0.98]]

  - id: STATION_04_PLAT_02
    vehicle_id: STATION_04
    source: sample://videos/platform_02.mp4
    analyze_every_n_frames: 2
    zones:
      platform_area:
        type: occupancy
        polygon: [[0.00, 0.30], [1.00, 0.30], [1.00, 0.95], [0.00, 0.95]]
        max_capacity: 200
      track_edge_zone:
        type: restricted
        polygon: [[0.00, 0.95], [1.00, 0.95], [1.00, 1.00], [0.00, 1.00]]
