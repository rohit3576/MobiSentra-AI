# MobiSentra severity + debounce policy (Phase 6, Step 6.2).
#
# Operator-tunable: edit values here, no code changes. Structure is fixed:
#   - entering the `overcrowded` band emits event_type `overcrowding`; every
#     other band flip (including de-escalation resolutions) emits
#     `occupancy_level_change` — that mapping is code, only severities live here
#   - fight re-fire escalation (CRITICAL confirmation proxy) is engine state
#     (Step 6.1b); only its window + severity are configured here
#   - `person_down` is reserved (nothing emits it yet) and rejected here
#
# Cooldowns are minutes (operator units); the loader converts to seconds.

severity:
  fall_detected: HIGH
  altercation_suspected: HIGH
  restricted_zone_entry: LOW
  door_obstruction: MEDIUM
  overcrowding: MEDIUM            # entering the `overcrowded` band
  occupancy_level_change: LOW     # other band flips (incl. de-escalation)
  overcrowding_ratio_escalation:
    at: 1.5                       # capacity ratio that bumps overcrowding...
    to: HIGH                      # ...from MEDIUM to HIGH

debounce:
  cooldown_minutes:
    fall_detected: 5
    altercation_suspected: 3
    overcrowding: 2
    occupancy_level_change: 2
    restricted_zone_entry: 10
    door_obstruction: 5
  fight_escalation:
    window_minutes: 10
    severity: CRITICAL
