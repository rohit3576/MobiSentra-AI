name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. If applicable, add a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - edge (Python pipeline)
        - backend (Node.js/TS)
        - dashboard (React)
        - infra (compose/bridge)
        - schemas
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU (if vision-related), Docker version
